services:
  app:
#    build:
#      context: .
#      dockerfile: Dockerfile
    image: ghcr.io/alexand7e/capacitia:june-05
    container_name: capacitia-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.sobdemanda.mandu.piaui.pro/v1}
      - TZ=America/Fortaleza
    volumes:
      - ./.data/chroma:/app/.data/chroma
      - ./.data/chat:/app/.data/chat
      - ./.data/processed:/app/.data/processed
      - ./.data/raw:/app/.data/raw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
